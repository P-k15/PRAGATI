name: pragati
description: A new Flutter project for PRAGATI - Public Redressal & AI-driven Grievance Automation, Tracking & Intelligence.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.18.0
  http: ^1.2.0
  provider: ^6.1.0
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png.png

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon.png.png"
  min_sdk_android: 21